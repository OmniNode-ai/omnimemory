[tool.poetry]
name = "omnimemory"
version = "0.1.0"
description = "Advanced memory management and retrieval system for AI applications"
authors = ["OmniNode-ai <contact@omninode.ai>"]
readme = "README.md"
packages = [{include = "omnimemory", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# Core MCP integration for Archon connectivity
mcp = "^1.8.0"

# HTTP client for MCP calls and API communication
httpx = "^0.28.0"

# Data validation and serialization
pydantic = "^2.10.0"

# FastAPI web framework for production API
fastapi = "^0.120.1"
uvicorn = {extras = ["standard"], version = "^0.32.0"}

# Memory and storage components
# Database support for memory storage - using Supabase client
supabase = "^2.9.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.10"

# SQLAlchemy for memory database
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"

# Redis support for caching and ephemeral memory
redis = "^6.4.0"

# Vector database support
# Pinecone for vector memory storage
pinecone-client = "^4.1.0"

# Environment variable management
python-dotenv = "^1.0.1"

# Async support
asyncio-mqtt = "^0.16.0"

# JSON and YAML processing
pyyaml = "^6.0.2"

# ONEX dependencies - versioned releases from PyPI
omnibase-core = "^0.8.0"
omnibase-spi = "^0.5.0"

# Logging and monitoring
# Version ^23.3.0 required for compatibility with omnibase-infra (requires ^23.2.0)
structlog = "^23.3.0"

# Runtime configuration and utilities
pydantic-settings = "^2.10.1"
psutil = "^7.0.0"
aiohttp = "^3.12.15"

[tool.poetry.group.dev.dependencies]
# Handler reuse infrastructure from omnibase_infra
# Provides: HandlerDb, HandlerFileSystem, HandlerHttpRest, HandlerConsul, HandlerVault, etc.
# See docs/handler_reuse_matrix.md for complete handler mapping
omnibase-infra = "^0.2.1"

# Testing framework
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
pytest-timeout = "^2.3.1"
pytest-split = "^0.10.0"
pytest-xdist = "^3.5.0"

# Code formatting and linting (ruff replaces black, isort, flake8 - 10-100x faster)
ruff = "^0.8.0"

# Type checking (dual checker: mypy strict + pyright basic)
mypy = "^1.14.0"
pyright = "^1.1.390"

# Pre-commit hooks
pre-commit = "^4.0.1"

# Security
detect-secrets = "^1.5.0"

# Development utilities
memory-profiler = "^0.61.0"
docker = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    "**/archived/**",
    "**/archive/**",
    "**/__pycache__/**",
    "**/site-packages/**",
]

[tool.ruff.format]
# Use black-compatible formatting (ruff format is a drop-in replacement for black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = [
    "S101",      # Allow assert statements in tests
    "E501",      # Line too long (technical debt - will fix incrementally)
    "BLE001",    # Blind exception catching (technical debt)
    "E402",      # Module level import not at top (technical debt)
    "TC001",     # Type checking imports (technical debt)
    "TC003",     # Type checking imports (technical debt)
    "TC004",     # Type checking imports in __all__ re-exports (technical debt)
    "TC006",     # Quotes in typing.cast() (technical debt)
    "PLR0911",   # Too many returns (technical debt)
    "PLR0912",   # Too many branches (technical debt)
    "PLR0913",   # Too many arguments (technical debt)
    "PLR0915",   # Too many statements (technical debt)
    "PLR2004",   # Magic values (technical debt)
    "FBT001",    # Boolean positional args (technical debt)
    "FBT002",    # Boolean default args (technical debt)
    "EM101",     # Exception string literal (technical debt)
    "EM102",     # Exception f-string literal (technical debt)
    "TRY003",    # Long exception messages (technical debt)
    "TRY004",    # Exception type preference (technical debt)
    "TRY300",    # Consider else block (technical debt)
    "DTZ005",    # datetime.now() without tz (technical debt)
    "B008",      # Function call in defaults (technical debt)
    "ARG003",    # Unused class method argument (technical debt)
    "ERA001",    # Commented out code (technical debt)
    "SIM102",    # Nested if statements (technical debt)
    "B007",      # Unused loop variable (technical debt)
    "PT018",     # Assertion breakdown (technical debt)
    "EXE001",    # Shebang without executable (technical debt)
    "B904",      # raise from (will fix incrementally)
    "RET505",    # Unnecessary elif (will fix incrementally)
    "COM812",    # Trailing commas (will fix incrementally)
    "C901",      # Function complexity (architectural - not fixable easily)
    "E721",      # Type comparisons (technical debt)
    "N806",      # Variable naming (technical debt)
    "TRY203",    # Redundant exception handler (technical debt)
    "RUF003",    # Comment formatting (technical debt)
    "SIM117",    # Nested with statements (technical debt)
    "SIM105",    # contextlib.suppress (technical debt)
    "PTH123",    # Path.open() (technical debt)
    "PT017",     # pytest.raises in except (technical debt)
    "F841",      # Unused variable (technical debt)
    "ARG002",    # Unused method argument (technical debt)
    "T201",      # Print statements (technical debt)
    "FBT003",    # Boolean positional value in call (technical debt)
    "N802",      # Invalid function name (technical debt)
    "S603",      # Subprocess without shell (technical debt)
    "S607",      # Start process with partial path (technical debt)
    "ARG001",    # Unused function argument (technical debt)
    "PLR0917",   # Too many positional args (technical debt)
    "S311",      # Random not for crypto (technical debt)
    "RET504",    # Unnecessary assignment (technical debt)
    "S602",      # subprocess call with shell=True (validation scripts)
    "INP001",    # Missing __init__.py (scripts don't need it)
    "TRY002",    # Raise vanilla class (technical debt)
    "PGH003",    # type: ignore without code (technical debt)
    "RUF001",    # String ambiguous unicode (technical debt)
    "RUF002",    # Docstring ambiguous unicode (technical debt)
    "RUF022",    # __all__ not sorted (technical debt)
    "TID252",    # Relative imports from parent (technical debt - will fix)
    "A004",      # Import shadowing builtin (technical debt - SystemError alias)
    "S608",      # SQL injection (test code)
    "PT019",     # Fixture without value (technical debt)
    "PT012",     # pytest.raises multiple statements (technical debt)
    "B015",      # Pointless comparison (test code)
    "B018",      # Useless expression (test code)
    "N801",      # Invalid class name (technical debt)
    "N803",      # Invalid argument name (technical debt)
    "N999",      # Invalid module name (technical debt)
    "UP007",     # Use X | Y for type annotations (tech debt - many occurrences)
    "F821",      # Undefined name (protocols use forward refs)
    "PLR0206",   # Cannot have defined parameters for properties (design choice)
    "A002",      # Function argument shadowing builtin (design choice)
    "B024",      # Abstract class without abstract methods (design choice)
    "SLF001",    # Private member accessed (test code needs this)
    "S105",      # Possible hardcoded password (test fixtures)
    "PT011",     # pytest.raises too broad (tech debt)
    "SIM118",    # Use key in dict instead of dict.keys() (tech debt)
    "A001",      # Variable shadowing builtin (design choice)
    "RUF012",    # Mutable class attrs should be ClassVar (tech debt)
    "PLW0603",   # Using global statement (design choice)
    "ARG005",    # Unused lambda argument (design choice)
    "TRY301",    # Abstract raise to inner function (tech debt)
    "TRY400",    # Use logging.exception (tech debt)
    "F822",      # Undefined name in __all__ (tech debt - will fix)
    "SIM110",    # Use any() instead of for loop (tech debt)
    "G004",      # Logging uses f-string (tech debt)
    "B017",      # pytest.raises(Exception) evil (test code)
    "S110",      # try-except-pass (design choice in cleanup)
    "SIM101",    # Multiple isinstance calls (tech debt)
    "RUF005",    # Consider unpacking instead of concatenation (tech debt)
]

[tool.ruff.lint.isort]
known-first-party = ["omnimemory"]

[tool.mypy]
# Strict mode enables: warn_return_any, warn_unused_configs, disallow_untyped_defs,
# disallow_incomplete_defs, check_untyped_defs, disallow_untyped_decorators,
# no_implicit_optional, warn_redundant_casts, warn_unused_ignores, strict_equality, and more
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = ["redis.*", "pinecone.*", "supabase.*", "asyncpg.*", "structlog.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "unit: marks tests as unit tests (no external dependencies)",
    "benchmark: marks tests as performance benchmarks",
    "slow: marks tests as slow-running (excluded from quick test runs)",
]
