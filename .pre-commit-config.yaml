---
# OmniMemory Pre-commit Configuration
# Aligned with ONEX ecosystem standards from omnibase_core
#
# REQUIREMENTS:
# ====================================
# Poetry version: 2.2.1 (must match .github/workflows/test.yml POETRY_VERSION)
# Python version: 3.12 (must match .github/workflows/test.yml PYTHON_VERSION)
#
# CONFIGURATION FILES (shared with CI):
# ====================================
# - pyproject.toml: ruff settings [tool.ruff], mypy settings [tool.mypy]
# - pyrightconfig.json: pyright settings
#
# PERFORMANCE OPTIMIZATION:
# ====================================
# Two-stage validation strategy for optimal developer experience:
#
# PRE-COMMIT (target: <15 seconds):
#   - Formatting (ruff format/fix, yamlfmt)
#   - Basic file checks (whitespace, large files, merge conflicts)
#   - Security checks (secrets)
#   - Fast pattern validations
#
# PRE-PUSH (quick validation before sharing):
#   - mypy type checking (full src/omnimemory - synced with CI)
#   - pyright type checking (full src/omnimemory - synced with CI)
#   - Naming convention validation
#
# USAGE:
#   pre-commit install                    # Install pre-commit hooks
#   pre-commit install --hook-type pre-push  # Install pre-push hooks
#   pre-commit run --all-files            # Run all pre-commit hooks
#   pre-commit run --all-files --hook-stage pre-push  # Run pre-push hooks

repos:
  # YAML formatting (standard across ecosystem)
  # Configuration in .yamlfmt file (ecosystem-aligned settings)
  - repo: https://github.com/google/yamlfmt
    rev: v0.17.2
    hooks:
      - id: yamlfmt
        exclude: ^(.github/workflows/)

  # Essential file formatting (standard across ecosystem)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^\.github/workflows/
      - id: end-of-file-fixer
        exclude: ^(\.github/workflows/|\.mcp\.json$)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: debug-statements

  # Python code quality with ruff (replaces black, isort, flake8 - 10-100x faster)
  # Configuration: pyproject.toml [tool.ruff] section (shared with CI)
  - repo: local
    hooks:
      # FULL CODEBASE FORMATTING: These hooks run on src/ and tests/ (not just staged files)
      # to match CI behavior and prevent "works locally, fails in CI" issues.
      - id: ruff-format
        name: ruff format (auto-format entire codebase)
        # SYNCHRONIZED WITH CI: Must match .github/workflows/test.yml lint job
        # CI runs: poetry run ruff format --check src/ tests/
        # Pre-commit auto-formats, CI validates (no --check here, CI uses --check)
        entry: poetry run ruff format src/ tests/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-fix
        name: ruff check (auto-fix entire codebase)
        # SYNCHRONIZED WITH CI: Must match .github/workflows/test.yml lint job
        # CI runs: poetry run ruff check src/ tests/
        # Pre-commit auto-fixes (--fix), CI validates (no --fix)
        entry: poetry run ruff check --fix --exit-non-zero-on-fix src/ tests/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        # Note: --exit-non-zero-on-fix ensures pre-commit fails if files were modified,
        # forcing you to re-stage the changes. This keeps pre-commit and CI in sync.

      - id: mypy-type-check
        name: mypy (type checking - strict)
        # SYNCHRONIZED WITH CI: Must match .github/workflows/test.yml lint job
        # CI runs: poetry run mypy src/omnimemory
        entry: poetry run mypy src/omnimemory
        language: system
        types: [python]
        files: ^src/omnimemory/.*\.py$
        pass_filenames: false  # Run on entire directory to match CI behavior
        stages: [pre-push]

      - id: pyright-type-check
        name: pyright (type checking - basic)
        # SYNCHRONIZED WITH CI: Must match .github/workflows/test.yml pyright job
        # CI runs: poetry run pyright src/omnimemory
        # Uses pyrightconfig.json for project-level settings
        entry: poetry run pyright src/omnimemory
        language: system
        types: [python]
        files: ^src/omnimemory/.*\.py$
        pass_filenames: false  # Run on entire directory to match CI behavior
        stages: [pre-push]

      # Cleanup: Clear tmp/ directory before commits
      - id: clean-tmp-directory
        name: Clean tmp directory
        entry: bash -c "rm -rf tmp/* 2>/dev/null || true"
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  # ONEX Framework Validation
  - repo: local
    hooks:
      # ONEX Pydantic Pattern Validation
      # Validates Pydantic models follow ONEX conventions
      - id: validate-pydantic-patterns
        name: ONEX Pydantic Pattern Validation
        entry: poetry run python scripts/validation/validate_pydantic_patterns.py
        language: system
        pass_filenames: true
        files: ^src/.*\.py$
        exclude: ^tests/.*\.py$
        stages: [pre-commit]

      # ONEX Single Class Per File (enforces model-per-file pattern)
      - id: validate-single-class-per-file
        name: ONEX Single Class Per File
        entry: poetry run python scripts/validation/validate_single_class_per_file.py
        language: system
        pass_filenames: true
        files: ^src/omnimemory/models/.*\.py$
        exclude: ^(tests/|src/omnimemory/protocols/).*\.py$
        stages: [pre-commit]

      # ONEX No Backward Compatibility Anti-Pattern Detection
      - id: validate-no-backward-compatibility
        name: ONEX Backward Compatibility Anti-Pattern Detection
        entry: poetry run python scripts/validation/validate_no_backward_compatibility.py
        args: ['-d', 'src/']
        language: system
        pass_filenames: false
        files: ^.*\.py$
        stages: [pre-commit]

      # ONEX Enum Member Casing Validation
      # Enforces UPPER_SNAKE_CASE for all enum member names
      - id: validate-enum-casing
        name: ONEX Enum Member Casing Validation
        entry: poetry run python scripts/validation/validate_enum_casing.py
        language: system
        pass_filenames: true
        files: ^src/omnimemory/enums/.*\.py$
        stages: [pre-commit]

      # Secret Detection (prevents hardcoded secrets)
      - id: validate-secrets
        name: ONEX Secret Detection
        entry: poetry run python scripts/validation/validate_secrets.py
        language: system
        pass_filenames: true
        files: ^src/.*\.py$
        exclude: ^tests/.*\.py$
        stages: [pre-commit]

      # Naming Convention Validation (pre-push - slower scan)
      - id: validate-naming-conventions
        name: ONEX Naming Convention Validation
        entry: poetry run python scripts/validation/validate_naming.py
        args: ['src/']
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
        exclude: ^tests/.*\.py$
        stages: [pre-push]

# Configuration
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

# Performance optimization: Enable parallel execution
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes for omnimemory

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_schedule: weekly
  submodules: false
