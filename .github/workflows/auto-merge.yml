#
# OMN-6571: Automatically enable auto-merge (squash) on every PR opened
# by jonahgabriel. Ensures PRs do not sit idle in the merge queue waiting
# for manual enrollment.
#
# OMN-7786: Re-trigger on review and check_suite events so the workflow
# re-attempts auto-merge after review finishes and branch
# protection gates clear. Silent continue-on-error removed; "already
# enqueued" races are tolerated but real failures surface.
#
# OMN-14777 (F-24): DROP `reopened` and `ready_for_review` from the
# pull_request trigger, mirroring OMN-14763 (seed fix landed in
# omninode_infra). Marking a draft ready-for-review used to force-arm
# auto-merge, forcing manual draft-holds on evidence-stamped PRs during the
# 2026-07-16 sweep. This aligns with OMN-14151 (default = do NOT auto-arm on
# open/ready). An actually-ready green PR is still armed by the
# pull_request_review / check_suite re-attempt paths below and by
# workflow_dispatch -- just not by the draft->ready transition itself. This
# workflow is NOT a required status check on dev, so narrowing it cannot
# wedge branch protection (verified live via required_status_checks readback
# before landing).
# OMN-19216 (2026-09-22): RE-ADD `ready_for_review` to the pull_request
# trigger, by operator decision. OMN-14777 dropped it because the ready
# flip force-armed PRs someone meant to hold; since then a PR opened as a
# draft was never armed by its flip and needed a manual arming step.
# This repository has no OMN-18179 hold gate; the author gate below and
# the already-armed guard are what bound arming on the flip.
# Arming stays limited to the allowed author (the resolve step reads the
# PR author from the payload, not the sender who flipped it), and the
# Enable step returns early when the PR is already armed, so a ready flip
# racing a check_suite or review event cannot arm twice.
name: Auto-Merge

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to enable auto-merge on"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# OMN-19216: one arming run per PR at a time. A newer event queues behind
# a running one instead of racing it; the already-armed guard makes the
# queued run a no-op. Every arming path carries a PR number. The constant
# fallback covers only a check_suite with no associated PR, which the
# resolve step skips, and it keeps those in one group rather than giving
# each run a unique key that would serialize nothing.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      github.event.inputs.pr_number ||
      github.event.check_suite.pull_requests[0].number ||
      'no-pr'
    }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and author
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PAYLOAD: ${{ github.event.pull_request.number }}
          PR_FROM_DISPATCH: ${{ github.event.inputs.pr_number }}
          CHECK_SUITE_PRS: ${{ toJson(github.event.check_suite.pull_requests) }}
          PR_AUTHOR_FROM_PAYLOAD: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_review)
              PR="$PR_FROM_PAYLOAD"
              ACTOR="$PR_AUTHOR_FROM_PAYLOAD"
              ;;
            workflow_dispatch)
              PR="$PR_FROM_DISPATCH"
              ACTOR="$(gh pr view "$PR" --json author --jq '.author.login')"
              ;;
            check_suite)
              PR="$(echo "$CHECK_SUITE_PRS" | jq -r 'if type == "array" and length > 0 then .[0].number else empty end')"
              if [ -z "$PR" ]; then
                echo "check_suite had no associated PRs; nothing to do"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ACTOR="$(gh pr view "$PR" --json author --jq '.author.login')"
              ;;
            *)
              echo "unsupported event: $EVENT_NAME"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Enable auto-merge
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          # OMN-19216: a ready flip, a check_suite completion and a review can each
          # reach this step for one PR. An already-armed PR is left alone rather
          # than armed a second time.
          armed="$(gh pr view "$PR" --repo "$GH_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$armed" = "true" ]; then
            echo "PR #${PR} is already armed; not arming again (OMN-19216)."
            exit 0
          fi
          # OMN-13138/13214: on a queue-controlled branch the merge method is
          # set by the merge queue, so passing an explicit --squash is
          # rejected ("The merge strategy for dev is set by the merge queue")
          # and the PR is NEVER enqueued (sits CLEAN + auto-merge armed
          # forever). Try bare --auto FIRST so that regime keeps working if a
          # queue returns.
          #
          # OMN-16509 (porting the OMN-16501 fix landed in omniclaude#2033,
          # merge bfa618e22): dev is NOT currently queue-controlled -- verified
          # live for this repo 2026-08-28, mergeQueue(branch:"dev") == null and
          # {auto:true, squash:true, merge:false, rebase:false} -- and gh's CLI
          # refuses a method-less --auto when run non-interactively even on a
          # squash-only repo ("--merge, --rebase, or --squash required when not
          # running interactively"), leaving a permanently red Enable
          # Auto-Merge check. Retry with --squash (this repo's one enabled
          # method) ONLY on that specific gh-CLI-side error string, so a
          # genuine queue-controlled rejection is never retried with an
          # explicit method and the OMN-13214 regime is untouched.
          if output=$(gh pr merge "$PR" --repo "$GH_REPO" --auto 2>&1); then
            echo "auto-merge enabled: $output"
            exit 0
          fi
          if echo "$output" | grep -qiE "already enqueued|already queued|auto-merge already enabled"; then
            echo "auto-merge not newly enabled (expected): $output"
            exit 0
          fi
          if echo "$output" | grep -qiE "required when not running interactively"; then
            echo "bare --auto rejected (no active merge queue): $output"
            if output=$(gh pr merge "$PR" --repo "$GH_REPO" --auto --squash 2>&1); then
              echo "auto-merge enabled (squash): $output"
              exit 0
            fi
            if echo "$output" | grep -qiE "already enqueued|already queued|auto-merge already enabled"; then
              echo "auto-merge not newly enabled (expected): $output"
              exit 0
            fi
            echo "auto-merge failed: $output"
            exit 1
          fi
          echo "auto-merge failed: $output"
          exit 1
