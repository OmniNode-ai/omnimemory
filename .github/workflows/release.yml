name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'omnimemory/v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.tag }}
    steps:
      # OMN-16343: mint an installation token for the org-owned app
      # onexbot-occ-writer. Push restrictions on main cannot authorize the
      # default workflow GITHUB_TOKEN (proven live on omnibase_core, GH006,
      # 2026-08-21); the Sync main step below pushes as this app identity
      # instead by having checkout persist this token for git operations.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Assert clean working tree
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Validate tag matches pyproject.toml version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Strip optional namespace prefix (e.g. omnimemory/v0.12.0 → v0.12.0)
          TAG="${TAG#omnimemory/}"
          TAG="${TAG#v}"
          PKG_VERSION=$(python3 -c "
          import tomllib, sys
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          v = d.get('project', {}).get('version')
          if not v:
              raise SystemExit('ERROR: missing [project].version in pyproject.toml')
          print(v)
          ")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v${TAG} does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Build wheel + sdist
        run: uv build

      - name: Verify dist artifacts exist
        run: |
          ls -la dist/
          ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1 || {
            echo "ERROR: expected wheel + sdist in dist/"
            exit 1
          }

      - name: Publish to PyPI
        run: |
          uv publish --token "$UV_PUBLISH_TOKEN" dist/*.whl dist/*.tar.gz
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Set release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$RELEASE_TAG" in
              ''|*[!A-Za-z0-9.+_-]*)
                echo "::error::release tag contains unsupported characters"
                exit 1
                ;;
            esac
            RAW_TAG="$RELEASE_TAG"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          # Preserve original tag for release creation (softprops/action-gh-release
          # requires the tag to already exist in git)
          echo "raw_tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          # Strip optional namespace prefix for version logic (e.g. omnimemory/v0.12.0 → v0.12.0)
          NORMALIZED="${RAW_TAG#omnimemory/}"
          echo "tag=${NORMALIZED}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.raw_tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, 'rc') }}

      # OMN-16289: main = the last release. Once a release publishes
      # successfully, fast-forward main to the released tag's commit SHA.
      # This is a non-force push of an already-proven dev SHA (release
      # tags are cut from dev; dev CI + this job already validated it).
      # Promotion PRs to main are retired -- main protection now empties
      # required_status_checks on main and restricts pushes to this job's
      # automation identity. OMN-16343: the default workflow GITHUB_TOKEN
      # cannot be authorized by push restrictions (proven live on
      # omnibase_core, GH006, 2026-08-21), so this push authenticates as
      # the org-owned app onexbot-occ-writer via the installation token
      # persisted by actions/checkout@v7 above (steps.app-token.outputs.token).
      # Restrictions re-add on main happens only after an observed release
      # sync proves this token path. Uses raw_tag (not the rc/namespace-
      # normalized tag) because that is the actual git ref (e.g.
      # omnimemory/v0.17.1).
      - name: Sync main to release tag
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.raw_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          echo "Resolved tag $TAG -> commit $TAG_SHA"
          git push origin "${TAG_SHA}:refs/heads/main"
          echo "main fast-forwarded to $TAG_SHA ($TAG)"

  # ---------------------------------------------------------------------------
  # Post-release: trigger Dockerfile.runtime pin cascade (OMN-5137)
  # ---------------------------------------------------------------------------
  # When omnimemory is released, notify omnibase_infra so its
  # plugin-pin-cascade workflow can bump Dockerfile.runtime pins automatically.
  #
  # OMN-16373: CROSS_REPO_PAT retired. repository_dispatch is gated on
  # Contents:write on the target repo, which the onexbot-occ-writer GitHub
  # App (org secrets ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY) already
  # grants org-wide (same pattern as omnibase_infra's trigger-runtime-rebuild
  # job).
  notify-plugin-pin-cascade:
    name: Notify Plugin Pin Cascade
    needs: release
    if: ${{ !contains(needs.release.outputs.version, 'rc') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check onexbot-occ-writer App credentials are configured
        id: token_check
        env:
          APP_ID: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY are not configured. Skipping cross-repo dispatch." \
              "Provision the onexbot-occ-writer App org secrets to enable plugin pin cascade."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: omnibase_infra

      - name: Dispatch plugin-release to omnibase_infra
        if: steps.token_check.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: OmniNode-ai/omnibase_infra
          event-type: plugin-release
          client-payload: >-
            {
              "package": "omninode-memory",
              "version": "${{ needs.release.outputs.version }}",
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}"
            }
