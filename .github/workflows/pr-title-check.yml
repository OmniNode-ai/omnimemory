# OMN-6912

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    # OMN-17427: the check runs from omnibase_core's reusable, the one copy every
    # repository of the same type calls. The caller job id `pr-title` and the
    # reusable's job `check-title` compose the required context
    # `pr-title / check-title` on pull_request and merge_group alike.
    permissions:
      contents: read
    uses: OmniNode-ai/omnibase_core/.github/workflows/pr-title-check.yml@1b6bc0cb3da1f804961e87f646cc85bf3d391149
    with:
      omnimarket-version: "0.4.310"
