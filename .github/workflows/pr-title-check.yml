name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    # OMN-20997: run the released title decision node under the existing context.
    # No checkout: the decision reads only the event's title and author.
    name: pr-title / check-title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Check PR title for ticket reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OMNIMARKET_VERSION: "0.4.310"
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pr-title-check"
          uv venv --quiet --python 3.12 "${venv}"
          # The node imports only pydantic, so omnimarket's own dependency tree is not installed.
          uv pip install --quiet --python "${venv}/bin/python" --no-deps "omnimarket==${OMNIMARKET_VERSION}"
          uv pip install --quiet --python "${venv}/bin/python" "pydantic>=2.11"
          "${venv}/bin/python" -I -c 'import json, os; print(json.dumps({"title": os.environ["PR_TITLE"], "author": os.environ["PR_AUTHOR"]}))' \
            | "${venv}/bin/python" -I -m omnimarket.nodes.node_pr_title_check_compute

  pr-title-merge-group:
    if: github.event_name == 'merge_group'
    name: pr-title / check-title
    runs-on: ubuntu-latest
    steps:
      - name: Accept merge-group title check
        run: |
          echo "PR title validation is enforced on pull_request opened/edited before enqueue."
