name: Imperative Contract Guard

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  imperative-contract-guard:
    # self-gating-ok: central guard is intentionally shared across repos; caller PRs do not modify the referenced workflow.
    uses: OmniNode-ai/onex_change_control/.github/workflows/imperative-contract-guard.yml@725d2967b031d7065efd41d0751f903638202cc1
    with:
      onex-change-control-ref: 725d2967b031d7065efd41d0751f903638202cc1
