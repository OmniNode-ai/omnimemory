name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Prevent auto-cancellation of running workflows when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.2.1"
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: "0.1.0"

jobs:
  # =============================================================================
  # JOB ORDERING RATIONALE (Fail-Fast Optimization)
  # =============================================================================
  #
  # Phase 1 - Quick Validation (parallel, ~2-3 min):
  #   - lint: Code quality (ruff format, ruff check, mypy strict)
  #   - pyright: Type checking (complementary to mypy)
  #
  # Phase 2 - Full Test Suite (after Phase 1 completes):
  #   - test: Run all tests
  #
  # Phase 3 - Aggregation:
  #   - test-summary: Aggregates all job results
  # =============================================================================

  # Phase 1 - Code Quality
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            ${{ hashFiles('**/poetry.lock') }}-
            ${{ env.CACHE_VERSION }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}-${{ env.CACHE_VERSION }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Check ruff formatting
        run: poetry run ruff format --check src/ tests/

      - name: Check ruff linting (includes import sorting)
        run: poetry run ruff check src/ tests/

      - name: Run mypy type checking (strict)
        run: poetry run mypy src/omnimemory

  # Phase 1 - Pyright Type Checking
  pyright:
    name: Pyright Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            ${{ hashFiles('**/poetry.lock') }}-
            ${{ env.CACHE_VERSION }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}-${{ env.CACHE_VERSION }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run pyright type checking
        run: poetry run pyright src/omnimemory

  # Phase 1 - ONEX Validation
  onex-validation:
    name: ONEX Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            ${{ hashFiles('**/poetry.lock') }}-
            ${{ env.CACHE_VERSION }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}-${{ env.CACHE_VERSION }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Validate Pydantic patterns
        run: poetry run python scripts/validation/validate_pydantic_patterns.py src/

      - name: Validate single class per file
        run: poetry run python scripts/validation/validate_single_class_per_file.py src/omnimemory/models/

      - name: Validate enum casing
        run: poetry run python scripts/validation/validate_enum_casing.py src/omnimemory/enums/

      - name: Validate no backward compatibility
        run: poetry run python scripts/validation/validate_no_backward_compatibility.py -d src/

      - name: Validate secrets
        run: poetry run python scripts/validation/validate_secrets.py src/

      - name: Validate naming conventions
        run: poetry run python scripts/validation/validate_naming.py src/

      - name: ONEX validation summary
        if: always()
        run: |
          echo "## ONEX Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validated the following ONEX patterns:" >> $GITHUB_STEP_SUMMARY
          echo "- Pydantic patterns" >> $GITHUB_STEP_SUMMARY
          echo "- Single class per file" >> $GITHUB_STEP_SUMMARY
          echo "- Enum member casing (UPPER_SNAKE_CASE)" >> $GITHUB_STEP_SUMMARY
          echo "- No backward compatibility anti-patterns" >> $GITHUB_STEP_SUMMARY
          echo "- Secret detection" >> $GITHUB_STEP_SUMMARY
          echo "- Naming conventions" >> $GITHUB_STEP_SUMMARY

  # Phase 2 - Test Suite
  test:
    name: Tests
    needs: [lint, pyright, onex-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            ${{ hashFiles('**/poetry.lock') }}-
            ${{ env.CACHE_VERSION }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}-${{ env.CACHE_VERSION }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: |
          poetry run pytest tests/ \
            -n auto \
            --timeout=60 \
            --timeout-method=thread \
            --tb=short \
            --junitxml=junit.xml \
            --cov=src/omnimemory \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # Phase 3 - Aggregation
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, pyright, onex-validation, test]
    if: always()

    steps:
      - name: Check test results
        run: |
          lint="${{ needs.lint.result }}"
          pyright="${{ needs.pyright.result }}"
          onex="${{ needs.onex-validation.result }}"
          test="${{ needs.test.result }}"

          if [[ "$lint" == "success" ]] && \
             [[ "$pyright" == "success" ]] && \
             [[ "$onex" == "success" ]] && \
             [[ "$test" == "success" ]]; then
            echo "All tests passed successfully"
            echo "Code Quality: Passed"
            echo "Pyright Type Checking: Passed"
            echo "ONEX Validation: Passed"
            echo "Tests: Passed"
            exit 0
          else
            echo "Tests failed"
            echo "Lint: $lint"
            echo "Pyright: $pyright"
            echo "ONEX Validation: $onex"
            echo "Tests: $test"
            exit 1
          fi
