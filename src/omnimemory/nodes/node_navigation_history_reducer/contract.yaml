---
# ONEX Contract: node_navigation_history_reducer
# Reduces navigation history events into aggregated session context

name: node_navigation_history_reducer
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: reducer
input_model: "ModelNavigationHistoryRequest"
output_model: "ModelNavigationHistoryResponse"
description: |
  Reduces navigation history events into aggregated session context.
  Requires pg_dsn, qdrant, and embedding parameters at runtime.

handler_config:
  handler_class: "HandlerNavigationHistoryReducer"
  handler_module: "omnimemory.nodes.node_navigation_history_reducer.handlers.handler_navigation_history_reducer"

# === TRANSPORT DECLARATIONS ===
metadata:
  transport_type: "DATABASE"

handler_routing:
  version:
    major: 1
    minor: 0
    patch: 0
  routing_strategy: operation_match
  # OMN-15268: the `qdrant` and `http` entries that used to open this list are
  # REMOVED, not repointed. Three independent proofs that nothing could ever
  # dispatch through them:
  #   * HandlerQdrant and HandlerHttp do not exist. The module they named
  #     exports exactly ["HandlerNavigationHistoryReducer",
  #     "HandlerNavigationHistoryWriter"], and neither class name appears
  #     anywhere in omnimemory src/ — getattr() raised AttributeError at boot,
  #     so both routes resolved to nothing.
  #   * There is no discriminator they could match. This node's declared
  #     input_model, ModelNavigationHistoryRequest, has exactly one field
  #     (`session: ModelNavigationSession`) — no operation/routing field — so an
  #     operation_match strategy can never select the key "qdrant" or "http".
  #   * They named transports, not operations. The Qdrant writes and the HTTP
  #     embedding call they gesture at are internal to
  #     HandlerNavigationHistoryWriter, which is reached through the retained
  #     `reduce` route (HandlerNavigationHistoryReducer.execute() wraps the
  #     writer). Sub-handlers are not dispatch targets — the same OMN-15235
  #     finding, restated.
  # No capability is lost: both code paths remain live under `reduce`. The
  # transport declaration for this node is `metadata.transport_type: DATABASE`
  # above, which is where a transport belongs.
  handlers:
    - routing_key: "reduce"
      handler_key: "HandlerNavigationHistoryReducer"
      handler:
        name: "HandlerNavigationHistoryReducer"
        module: "omnimemory.nodes.node_navigation_history_reducer.handlers.handler_navigation_history_reducer"
      priority: 0
      output_events: []
  default_handler: "HandlerNavigationHistoryReducer"

tags:
  - memory
  - reducer
  - navigation
