---

# Persona Builder COMPUTE - ONEX Contract
# Pure COMPUTE node that classifies persona signals into an updated PersonaProfile.
# No I/O — takes signals and an optional existing profile, produces a new snapshot.

name: "node_persona_builder_compute"
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
description: >
  Pure compute node that takes a batch of PersonaSignal events and an optional existing PersonaProfile,
  then produces an updated PersonaProfile. Classification uses heuristic rules and threshold scoring (no
  ML). Conservatism rules prevent thrashing on weak evidence. Phase 3 Adaptive Personalization (OMN-7305).
node_type: compute
input_model: "ModelPersonaClassifyRequest"
output_model: "ModelPersonaClassifyResult"

algorithm:
  algorithm_type: "persona_classification"
  factors:
    technical_level:
      weight: 1.0
      calculation_method: "mode_with_confidence_threshold"
      threshold: 0.7
      min_sessions: 3
    vocabulary_complexity:
      weight: 1.0
      calculation_method: "exponential_moving_average"
      alpha: 0.2
    preferred_tone:
      weight: 1.0
      calculation_method: "mode_of_recent"
      window_size: 10
    domain_familiarity:
      weight: 1.0
      calculation_method: "incremental_exposure"
      increment: 0.1
      cap: 1.0
  normalization_method: "none"

# OMN-15268: this routing entry was correct and the CODE was missing —
# HandlerPersonaClassify did not exist, so the declared target resolved to
# nothing at boot. The class now exists in the module named below, with the
# canonical def-B `handle(request: ModelPersonaClassifyRequest) ->
# ModelPersonaClassifyResult` delegating to the pure `classify_persona`
# function. The handler ref is unchanged; only `handler_key` was corrected,
# because it named a `Class.method` pair that no loader resolves.
#
# Two additions make the single route actually selectable rather than merely
# declared. `operation:` is the field operation_match keys off — `routing_key`
# reaches it only through contract_normalizer.normalize_handler_routing, so the
# discriminator was dependent on a normalization pass. And `default_handler` now
# names this handler: ModelPersonaClassifyRequest carries no operation field at
# all (user_id / signals / existing_profile), so on a strict operation_match
# read there is nothing for the key "classify" to match against; the default is
# what makes the node's only handler reachable. This is a one-handler COMPUTE
# node, so there is no ambiguity about which handler the default names.
handler_routing:
  version:
    major: 1
    minor: 0
    patch: 0
  routing_strategy: operation_match
  handlers:
    - operation: "classify"
      routing_key: "classify"
      handler_key: "HandlerPersonaClassify"
      handler:
        name: "HandlerPersonaClassify"
        module: "omnimemory.nodes.node_persona_builder_compute.handlers.handler_persona_classify"
      priority: 0
      output_events: []
  default_handler: "HandlerPersonaClassify"

tags:
  - persona
  - compute
  - classification
  - personalization
  - phase-3
