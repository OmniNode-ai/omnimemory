---
schema_version: "1.0.0"
ticket_id: OMN-23140
title: "Memory consumers resolve overlays through the primitive layer, so the intelligence-memory to seams-verify
  relation drops"
summary: >
  Eight omnimemory modules expanded ${env.VAR} contract references through omnibase_infra.runtime.overlay.contract_env_ref,
  the graph's seams-verify side. They now import the same function from omnibase_core.overlays.contract_env_ref,
  the primitive layer that already holds it with the same expansion rule, so no omnimemory module imports
  the infra overlay package. Tests in tests/unit/overlay read zero imports of the infra overlay package
  from this tree (and one for a planted import), and expand recorded reference cases to the values the
  infra copy returned.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23140-consumers-call-primitive
    statement: The memory consumers resolve overlays through the primitive layer and none imports the
      infra overlay package.
    acceptance:
      - id: "AC1"
        statement: "AC1: the twelve entities resolve overlays through the contract call and none imports
          the seams-verify module -- falsifier: uv run pytest src/omnimarket/nodes/node_network_graph_compute
          -q -k relation_count_memory_seams_verify"
  - id: req-omn23140-env-ref-expands
    statement: An environment reference expands to the value it expanded to before the cut.
    acceptance:
      - id: "AC2"
        statement: "AC2: an environment reference still expands to the same value on the recorded cases
          -- falsifier: uv run pytest tests/unit/overlay -q -k environment_reference_expands"
evidence_requirements:
  - kind: tests
    description: "The overlay tests pass over this tree"
    command: "uv run pytest tests/unit/overlay -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23140-ac1-no-infra-overlay-import
    description: "The relation count test reads zero imports of omnibase_infra.runtime.overlay in src/omnimemory
      and one for a planted import. The ticket's falsifier path names the omnimarket graph node tree;
      the count lives in this repository because the importers do."
    source: manual
    binds_ac:
      - "AC1"
    checks:
      - check_type: command
        check_value: "uv run pytest tests/unit/overlay -q --no-cov -k relation_count_memory_seams_verify"
        cwd: "${OMNI_HOME}/omnimemory"
  - id: dod-omn23140-ac2-env-ref-expands
    description: "Recorded reference cases expand to the same values through the core function, and each
      consumer module holds that function."
    source: manual
    binds_ac:
      - "AC2"
    checks:
      - check_type: command
        check_value: "uv run pytest tests/unit/overlay -q --no-cov -k environment_reference_expands"
        cwd: "${OMNI_HOME}/omnimemory"
