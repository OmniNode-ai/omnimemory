---
schema_version: "1.0.0"
ticket_id: "OMN-20997"
title: "omnimemory: pr-title check runs the omnimarket node"
summary: >-
  Run node_pr_title_check_compute from omnimarket 0.4.310 under the existing pr-title / check-title context,
  with the old reusable's verdicts preserved.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-local-pr-title-node"
    statement: >-
      PR Title Check runs the published omnimarket compute node locally and preserves its context, triggers,
      effective runner and title decision.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: PR Title Check produces pr-title / check-title by running node_pr_title_check_compute from
          a pinned omnimarket release, and no workflow line in pr-title-check.yml references onex_change_control
          -- falsifier: python -m pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k workflow
          fails at the merge base.
      - id: "AC2"
        statement: >-
          AC2: The installed node's verdicts equal the old reusable's verdicts on a table of titles and
          authors covering every exempt rule, a passing OMN title and a failing title -- falsifier: python
          -m pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k verdicts reports a differing
          exit code.
      - id: "AC3"
        statement: >-
          AC3: .github/required-checks.yaml names the pr-title / check-title row as a local producer --
          falsifier: python -m pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -k manifest fails
          at the merge base.
evidence_requirements:
  - kind: "tests"
    description: "Focused workflow, manifest and installed-node verdict checks."
    command: "uv run --no-project --with pytest --with pytest-asyncio --with pytest-xdist --with pyyaml
      pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-workflow-local-node"
    description: "Workflow runs the pinned node under the required context."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --no-project --with pytest --with pytest-asyncio --with pytest-xdist --with
          pyyaml pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -n 0 -k workflow"
    binds_ac: ["AC1"]
  - id: "dod-installed-node-parity"
    description: "Installed node and frozen bash oracle agree on all title cases."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --no-project --with pytest --with pytest-asyncio --with pytest-xdist --with
          pyyaml pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -n 0 -k verdicts"
    binds_ac: ["AC2"]
  - id: "dod-manifest-local-producer"
    description: "Required-check manifest declares the local title producer."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --no-project --with pytest --with pytest-asyncio --with pytest-xdist --with
          pyyaml pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -n 0 -k manifest"
    binds_ac: ["AC3"]
