---
schema_version: "1.0.0"
ticket_id: "OMN-20702"
title: "omnimemory refuses a new ONEX node outside omnimarket, against a shrink-only baseline of today's
  nodes"
summary: >-
  The node-home gate lives in omnibase_core as the check-node-home hook. This change turns it on in omnimemory:
  a baseline of the 13 node directories that exist here today, the check-node-home pre-commit hook, and
  CI steps in the Canonical File Shape job that plant a node directory and fail unless the check refuses
  it, then run the check against the pull request or merge-group base and fail closed when no base resolves.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn20702-alignment-registration"
    statement: >-
      Register node-home validation without requiring activation on dev or excluding the hook from validation
      after activation.
    acceptance:
      - id: "AC1"
        statement: >-
          The alignment tests accept the registered hook with its CI counterpart, refuse it when the CI
          module is absent, and pass before activation.
  - id: "req-omn20702-omnimemory-node-home"
    statement: >-
      omnimemory runs the node-home check in pre-commit and in CI, and a node directory absent from .onex_ratchets/node_home_baseline.txt
      is refused by both.
    acceptance:
      - id: "AC4"
        statement: >-
          AC4 (omnimemory): the pre-commit hook and the CI step run the check, the baseline lists only
          existing node directories, and the check accepts the tree -- falsifier: python -m pytest tests/ci/test_node_home_activation_omn20702.py
          fails.
evidence_requirements:
  - kind: "tests"
    description: "Focused alignment validator tests pass."
    command: "uv run --no-project --with pytest --with pytest-asyncio --with pyyaml pytest tests/unit/test_validate_ci_precommit_alignment.py
      -q"
  - kind: "tests"
    description: "The node-home activation tests pass."
    command: "uv run --no-project --with pytest --with pytest-asyncio --with pyyaml --with omnibase-core==0.47.43
      pytest tests/ci/test_node_home_activation_omn20702.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20702-alignment-registration"
    description: "The validator checks the active hook and refuses its missing CI command."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --no-project --with pytest --with pytest-asyncio --with pyyaml pytest tests/unit/test_validate_ci_precommit_alignment.py
          -q"
  - id: "dod-omn20702-omnimemory-ac4"
    description: "The node-home activation tests pass, including the check against the committed baseline."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --no-project --with pytest --with pytest-asyncio --with pyyaml --with omnibase-core==0.47.43
          pytest tests/ci/test_node_home_activation_omn20702.py -q"
