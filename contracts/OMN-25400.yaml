ticket_id: "OMN-25400"
title: Third-party dependency bumps ride the release train; omnimemory opens no Dependabot version-update
  pull requests
summary: >-
  omnimemory drops its Dependabot version-update schedules by deleting .github/dependabot.yml, which declared
  nothing else. Security alerts are repository settings and are not touched. The registry-wide ratchet
  and the release-train refresh are in omnibase_infra (OMN-21351). This contract binds every criterion
  AC1 to AC4 the live ticket carries, in requirements[].acceptance with its live text; the four describe
  repairing Dependabot pull request 745 in place, which this pull request replaces, so each is open here
  and read by a verifier lane. No criterion_hash pin is recorded: detect-secrets flags a 64-character
  hex value in this repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-no-dependabot-version-updates
    statement: omnimemory declares no Dependabot version-update schedule, which is the change this pull
      request makes; the four live criteria of the ticket describe repairing Dependabot pull request 745
      in place, which this pull request replaces, so each is declared open below and none is claimed met.
    acceptance:
      - id: "AC1"
        statement: "AC1: the required check public-repo-hygiene / public-repo-hygiene of omnimemory PR
          745 reads success at a new head, read through the declared scm path after the fix push -- falsifier:
          `onex scm pr-checks OmniNode-ai/omnimemory#745` lists public-repo-hygiene / public-repo-hygiene
          as not success at the new head"
      - id: "AC2"
        statement: "AC2: the fix weakens no check, so the diff from head 89e2ed8fbc1a to the new head
          removes no assertion, adds no skip, xfail or loosened threshold and edits no hygiene vocabulary,
          workflow gate or hook config -- falsifier: `git diff 89e2ed8fbc1a <new head> -- tests/ .github/
          .pre-commit-config.yaml` shows a removed assert, a new skip or xfail marker or a widened check"
      - id: "AC3"
        statement: "AC3: the new head is on the PR as a comment starting `Lab: head=<new head>` that carries
          the lab red then green result -- falsifier: `onex scm pr-view OmniNode-ai/omnimemory#745` shows
          no comment starting `Lab: head=` with the new head"
      - id: "AC4"
        statement: "AC4: a cause outside the PR is recorded and not patched around, as a STATUS row with
          `cause=` and `shared=yes` naming the evidence -- falsifier: `grep -F 'unblk745-1511' \"$ONEX_LEDGER_PATH\"`
          shows no STATUS row with shared=yes while a required check stays red for a cause that the base
          branch also shows"
evidence_requirements:
