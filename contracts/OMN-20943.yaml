          725d2967 entries and a planted extra path is refused by the core ratchet handler (uv run pytest
          on that file)
      - id: "AC3"
        statement: >-
          AC3: The guard still refuses what it refused before on omnimemory's tree -- falsifier: on a
          lab host, the core handler run over omnimemory's tree with a planted imperative contract exits
