---
schema_version: "1.0.0"
ticket_id: "OMN-19998"
title: "omnimemory CI runs on GitHub-hosted runners; the public runner placement check gates CI Summary"
summary: >-
  Operator ruling 2026-10-16T07:07:09Z: CI runners are for private repositories only. omnimemory is public,
  so every routing fallback in its workflows that named the self-hosted omnibase-ci fleet falls back to
  ubuntu-latest, and omnibase_core's check-public-runner-placement runs as a CI Summary member job and
  as a pre-commit hook at one core release.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn19998-public-runner-placement"
    statement: "No omnimemory workflow routing fallback names the self-hosted fleet, and core's placement
      check runs in CI Summary and in pre-commit at one core release."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: no workflow line in omnimemory falls back to the self-hosted fleet, the Public Runner Placement
          job is unconditional, hosted, carries a positive control and the same core release as the pre-commit
          hook, and CI Summary requires its success -- falsifier: uv run pytest tests/ci/test_public_runner_placement_omn19998.py
          -q fails at the merge base, where 11 fallback lines name the fleet and neither the job nor the
          hook exists
  - id: "req-omn19998-omnimemory-dev-merge-tag"
    statement: "Operator RULING 2026-10-16T09:35:49Z: tags replace releases, made automatic. omnimemory,
      a sibling another platform repository consumes, tags every push to dev with a lightweight dev-<UTC
      YYYYMMDDHHMMSS>-<sha12> tag on the pushed commit, idempotent per commit, with no tag on any other
      ref, so a consumer can pin it through a uv git source."
    acceptance:
      - id: "AC2"
        statement: "AC2: .github/workflows/dev-merge-tag.yml triggers only on push to dev, and its tag
          step, run against a throwaway repository with a +05:30 committer date, pushes one lightweight
          tag named dev-<committer time in UTC>-<sha12> at the commit, pushes nothing on a second run
          or when a dev tag for that sha already exists, pushes nothing in a dry run, and refuses a value
          that is not a full sha -- falsifier: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py
          -q -n 0 fails at the merge base, where the workflow does not exist"
evidence_requirements:
  - kind: "tests"
    description: "The placement tests read every workflow file for the fleet fallback, the ci.yml job,
      the pre-commit config and the CI Summary wiring."
    command: "uv run pytest tests/ci/test_public_runner_placement_omn19998.py -q -n 0"
emergency_bypass:
