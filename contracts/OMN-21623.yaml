---
schema_version: "1.0.0"
ticket_id: "OMN-21623"
title: "omnimemory burn-down slices: navigation, lifecycle, intent storage and topic values resolve from
  node contracts and overlays"
summary: "The navigation-history reducer's embedding model and client timeouts are injected as ModelNavigationClientSettings.
  The lifecycle orchestrator's archive, expire and tick handlers receive ModelLifecycleTimeoutSettings.
  Intent storage circuit breaker thresholds and recovery time resolve as ModelIntentStorageSettings. Settings
  models expand node contract descriptor values with the ${env.VAR:default} overlay convention. Dispatch
  and kreuzberg topics resolve from node contract event_bus sections through ModelNodeEventBusTopics;
  the error sanitizer matches any credentialed connection string without naming a scheme."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: "req-nav-reducer-settings"
    statement: "The navigation-history reducer's handler holds no embedding model name and no client timeout
      literal; each is a contract descriptor value an overlay can replace, injected as ModelNavigationClientSettings."
    acceptance:
      - id: "AC1"
        statement: "AC1: the navigation reducer is injected its embedding model and its Postgres, Qdrant
          and embedding-HTTP timeouts as ModelNavigationClientSettings, resolved by the binding site from
          descriptor values in its contract.yaml with the env overlay replacing each -- falsifier: uv
          run pytest tests/nodes/node_navigation_history_reducer/test_client_settings.py -q -p no:randomly
          --no-cov fails at the merge base, where ModelNavigationClientSettings does not exist"
  - id: "req-lifecycle-timeouts"
    statement: "The lifecycle orchestrator's archive, expire and tick handlers hold no timeout literal;
      each is a contract descriptor value an overlay can replace, injected as ModelLifecycleTimeoutSettings."
    acceptance:
      - id: "AC2"
        statement: "AC2: the archive, expire and tick handlers are injected their database query, circuit-breaker
          recovery and projection-reader timeouts as ModelLifecycleTimeoutSettings, resolved from descriptor
          values in the node contract.yaml with the env overlay replacing each -- falsifier: uv run pytest
          tests/unit/nodes/test_memory_lifecycle_orchestrator/test_lifecycle_timeout_settings.py -q -p
          no:randomly --no-cov fails at the merge base, where ModelLifecycleTimeoutSettings does not exist"
  - id: "req-intent-storage-breaker"
    statement: "The intent storage adapter resolves its circuit breaker policy from the node contract
      descriptor or accepts an injected circuit breaker configuration; it holds no literal policy defaults."
    acceptance:
      - id: "AC3"
        statement: "AC3: intent storage breaker thresholds and recovery time resolve from the contract
          with environment overlays, invalid overlays fail at binding, explicit DI bypasses loading, and
          the unused timeout default is removed -- falsifier: uv run pytest tests/nodes/node_intent_storage_effect/test_circuit_breaker_settings.py
          -q --no-cov"
  - id: "req-resilience-injection"
    statement: "The concurrency, health, retry and intent-handler resilience code holds no timeout, backoff
      or polling literal; each is injected by the caller, and the error category backoff factors are contract
      overlay values."
    acceptance:
      - id: "AC4"
        statement: "AC4: circuit breaker, connection pool, retry, priority lock, health manager, PostgreSQL
          health probe and intent handler shutdown timeouts are required parameters or the handler's own
          configured value, and the error category backoff factors load from error_categories_contract.yaml
          with the env overlay replacing each -- falsifier: uv run pytest tests/unit/adapters/test_injected_timeouts.py
          -q -p no:randomly --no-cov fails at the merge base, where those parameters carry literal defaults"
  - id: "req-topics-from-contract"
    statement: "Dispatch aliases, lifecycle outcome topics and the kreuzberg publish topics are read from
      the node contracts' event_bus sections; code names no topic the contracts declare."
    acceptance:
      - id: "AC5"
        statement: "AC5: ModelNodeEventBusTopics resolves a topic from a node contract's event_bus by
          event name and refuses an undeclared name, and the navigation and semantic nodes declare their
          command topics as descriptor dispatch_topics without joining the plugin subscription set --
          falsifier: uv run pytest tests/unit/runtime/test_model_node_event_bus_topics.py -q --no-cov
          fails at the merge base, where ModelNodeEventBusTopics does not exist"
  - id: "req-sanitizer-connection-strings"
    statement: "The error sanitizer redacts a credentialed connection string of any scheme without naming
      a scheme or an endpoint in code."
    acceptance:
      - id: "AC6"
        statement: "AC6: bolt, postgresql, mysql, mongodb and redis connection strings carrying credentials
          are redacted by one scheme-agnostic pattern and a credential-free URL is left alone -- falsifier:
          uv run pytest tests/unit/adapters/test_adapter_error_sanitizer_connection_strings.py -q --no-cov
          fails at the merge base for the bolt connection string"
  - id: "req-handler-binding-sites"
    statement: "Handlers are built at container/registry_*.py binding sites; the plugin, the navigation
      and semantic compute node shells, the retrieval handler and the expire, filesystem and embedding
      HTTP adapters take them from those binders and construct none by hand."
    acceptance:
      - id: "AC7"
        statement: "AC7: the contracts_and_di check finds no handler_hand_construction in the files bound
          by this slice, the data classes HandlerMetrics and HandlerGraphRelationship are renamed CapturedMetrics
          and ModelGraphRelationship, and each binder builds its handler -- falsifier: uv run pytest tests/unit/runtime/test_handler_binding_sites.py
          -q -p no:randomly --no-cov fails at the merge base, where the binding sites do not exist"
evidence_requirements:
  - kind: "tests"
    description: "Contract defaults and overlays reach the intent storage adapter; invalid settings fail
      at binding and explicitly injected configurations bypass contract loading."
    command: "uv run pytest tests/nodes/node_intent_storage_effect/test_circuit_breaker_settings.py -q
      --no-cov"
  - kind: "tests"
    description: "The descriptor values resolve, the overlay wins, a bad value fails to load, the settings
      model has no defaults, and the writer hands the values to its clients."
    command: "uv run pytest tests/nodes/node_navigation_history_reducer/test_client_settings.py -q -p
      no:randomly --no-cov"
  - kind: "tests"
    description: "The descriptor values resolve, the overlay wins, a bad value fails to load, the settings
      model has no defaults, and each handler uses the injected values."
    command: "uv run pytest tests/unit/nodes/test_memory_lifecycle_orchestrator/test_lifecycle_timeout_settings.py
      -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "The resilience parameters have no default, the injected values reach the lock, the probe
      and the handler shutdown, and the error category backoff overlay wins or fails to load."
    command: "uv run pytest tests/unit/adapters/test_injected_timeouts.py -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "Topics resolve from node contracts, dispatch-only nodes stay out of the subscription
      set, and an undeclared event name is refused."
    command: "uv run pytest tests/unit/runtime/test_model_node_event_bus_topics.py -q --no-cov"
  - kind: "tests"
    description: "Credentialed connection strings of any scheme are redacted and a credential-free URL
      is kept."
    command: "uv run pytest tests/unit/adapters/test_adapter_error_sanitizer_connection_strings.py -q
      --no-cov"
  - kind: "tests"
    description: "The core contracts_and_di check finds no hand-constructed handler in the bound files
      and each binder builds its handler."
    command: "uv run pytest tests/unit/runtime/test_handler_binding_sites.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
