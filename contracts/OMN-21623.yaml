---
schema_version: "1.0.0"
ticket_id: "OMN-21623"
title: "omnimemory burn-down slices: navigation, lifecycle and intent storage settings resolve from node
  contract descriptors and overlays"
summary: "The navigation-history reducer's embedding model and client timeouts are injected as ModelNavigationClientSettings.
  The lifecycle orchestrator's archive, expire and tick handlers receive ModelLifecycleTimeoutSettings.
  Intent storage circuit breaker thresholds and recovery time resolve as ModelIntentStorageSettings. Settings
  models expand node contract descriptor values with the ${env.VAR:default} overlay convention."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: "req-nav-reducer-settings"
    statement: "The navigation-history reducer's handler holds no embedding model name and no client timeout
      literal; each is a contract descriptor value an overlay can replace, injected as ModelNavigationClientSettings."
    acceptance:
      - id: "AC1"
        statement: "AC1: the navigation reducer is injected its embedding model and its Postgres, Qdrant
          and embedding-HTTP timeouts as ModelNavigationClientSettings, resolved by the binding site from
          descriptor values in its contract.yaml with the env overlay replacing each -- falsifier: uv
          run pytest tests/nodes/node_navigation_history_reducer/test_client_settings.py -q -p no:randomly
          --no-cov fails at the merge base, where ModelNavigationClientSettings does not exist"
  - id: "req-lifecycle-timeouts"
    statement: "The lifecycle orchestrator's archive, expire and tick handlers hold no timeout literal;
      each is a contract descriptor value an overlay can replace, injected as ModelLifecycleTimeoutSettings."
    acceptance:
      - id: "AC2"
        statement: "AC2: the archive, expire and tick handlers are injected their database query, circuit-breaker
          recovery and projection-reader timeouts as ModelLifecycleTimeoutSettings, resolved from descriptor
          values in the node contract.yaml with the env overlay replacing each -- falsifier: uv run pytest
          tests/unit/nodes/test_memory_lifecycle_orchestrator/test_lifecycle_timeout_settings.py -q -p
          no:randomly --no-cov fails at the merge base, where ModelLifecycleTimeoutSettings does not exist"
  - id: "req-intent-storage-breaker"
    statement: "The intent storage adapter resolves its circuit breaker policy from the node contract
      descriptor or accepts an injected circuit breaker configuration; it holds no literal policy defaults."
    acceptance:
      - id: "AC3"
        statement: "AC3: intent storage breaker thresholds and recovery time resolve from the contract
          with environment overlays, invalid overlays fail at binding, explicit DI bypasses loading, and
          the unused timeout default is removed -- falsifier: uv run pytest tests/nodes/node_intent_storage_effect/test_circuit_breaker_settings.py
          -q --no-cov"
evidence_requirements:
  - kind: "tests"
    description: "Contract defaults and overlays reach the intent storage adapter; invalid settings fail
      at binding and explicitly injected configurations bypass contract loading."
    command: "uv run pytest tests/nodes/node_intent_storage_effect/test_circuit_breaker_settings.py -q
      --no-cov"
  - kind: "tests"
    description: "The descriptor values resolve, the overlay wins, a bad value fails to load, the settings
      model has no defaults, and the writer hands the values to its clients."
    command: "uv run pytest tests/nodes/node_navigation_history_reducer/test_client_settings.py -q -p
      no:randomly --no-cov"
  - kind: "tests"
    description: "The descriptor values resolve, the overlay wins, a bad value fails to load, the settings
      model has no defaults, and each handler uses the injected values."
    command: "uv run pytest tests/unit/nodes/test_memory_lifecycle_orchestrator/test_lifecycle_timeout_settings.py
      -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21623-nav-reducer-settings"
    description: "AC1: the navigation reducer's embedding model and client timeouts are injected from
      its contract descriptor."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_navigation_history_reducer/test_client_settings.py
          -q -p no:randomly --no-cov"
    binds_ac: ["AC1"]
  - id: "dod-omn21623-lifecycle-timeouts"
    description: "AC2: the lifecycle handlers' database, circuit-breaker and projection-reader timeouts
      are injected from the node contract descriptor."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_memory_lifecycle_orchestrator/test_lifecycle_timeout_settings.py
          -q -p no:randomly --no-cov"
    binds_ac: ["AC2"]
  - id: "dod-omn21623-intent-storage-breaker"
    description: "AC3: intent storage circuit breaker settings resolve from the contract descriptor."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_intent_storage_effect/test_circuit_breaker_settings.py
          -q --no-cov"
    binds_ac: ["AC3"]
