---
schema_version: "1.0.0"
ticket_id: OMN-25649
title: Repo Evidence Gate caller runs on pull_request in omnimemory
summary: >-
  Move the omnimemory Repo Evidence Gate caller to pull_request and retain the repo-evidence / dod-verify
  check context.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-repo-evidence-caller-trigger
    statement: Migrate the caller and its trigger test in omnimemory.
    acceptance:
      - id: AC1
        statement: >-
          AC1: each public repository's call-repo-evidence-gate.yml on its default branch triggers on
          pull_request, keeps the job id repo-evidence so the context name repo-evidence / dod-verify
          is unchanged, and no longer names pull_request_target -- falsifier: git grep -c pull_request_target
          origin/dev -- .github/workflows/call-repo-evidence-gate.yml returns 0 in each of the nine repositories
      - id: AC2
        statement: >-
          AC2: each repository's own tests that pin the old trigger are rewritten to pin the new one and
          pass -- falsifier: uv run pytest tests/ci -k repo_evidence in each repository
dod_evidence:
  - id: dod-omn25649-caller-trigger
    description: The omnimemory caller declares pull_request and the repo-evidence job.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: >-
          git grep -q '^  pull_request:$' -- .github/workflows/call-repo-evidence-gate.yml && git grep
          -q '^  repo-evidence:$' -- .github/workflows/call-repo-evidence-gate.yml && (if git grep -c
          pull_request_target -- .github/workflows/call-repo-evidence-gate.yml; then exit 1; else test
          "$?" -eq 1; fi)
        cwd: ${OMNI_HOME}/omnimemory
  - id: dod-omn25649-caller-tests
    description: The trigger and caller pin tests pass in the omnimemory checkout.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest -q tests/ci/test_repo_evidence_caller_omn20074.py tests/ci/test_receipt_gate_caller_pin_omn20134.py
          tests/ci/test_repo_evidence_caller_verifier_floor_omn20032.py
        cwd: ${OMNI_HOME}/omnimemory
