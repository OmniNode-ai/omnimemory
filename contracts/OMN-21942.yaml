---
schema_version: "1.0.0"
ticket_id: "OMN-21942"
title: "omnimemory consumes the omnibase_core validator hooks and deletes its repository copies"
summary: "Four local validator hooks are replaced by the omnibase_core hook ids at one dev-merge tag,
  and the repository copies of their scripts are deleted."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-consume-core-validators"
    statement: "omnimemory runs check-ai-slop, check-no-env-fallbacks, check-private-ip-compute and spdx-headers-check
      from omnibase_core and keeps no local copy of the four scripts."
    acceptance:
      - id: "AC1"
        statement: "AC1: .pre-commit-config.yaml declares the core hook ids check-ai-slop and spdx-headers-check
          -- falsifier: grep for those ids in .pre-commit-config.yaml"
      - id: "AC2"
        statement: "AC2: the four local scripts are deleted and nothing under scripts/validation names
          them -- falsifier: test -e on each deleted script"
      - id: "AC3"
        statement: "AC3: the CI and pre-commit alignment validator and its test still pass -- falsifier:
          uv run pytest tests/unit/test_validate_ci_precommit_alignment.py -q"
evidence_requirements:
  - kind: "tests"
    description: "The alignment validator test passes against the new hook ids."
    command: "uv run pytest tests/unit/test_validate_ci_precommit_alignment.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21942-core-hook-ids"
    description: "AC1: the pre-commit config pins the omnibase_core dev-merge tag that carries the core
      validator hooks."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q 'dev-20261101233629-173cd14208fe' .pre-commit-config.yaml"
        cwd: "${OMNI_HOME}/omnimemory"
    binds_ac: ["AC1"]
  - id: "dod-omn21942-core-spdx-hook"
    description: "AC1: the pre-commit config consumes the core spdx-headers-check hook."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q 'id: spdx-headers-check' .pre-commit-config.yaml"
        cwd: "${OMNI_HOME}/omnimemory"
    binds_ac: ["AC1"]
  - id: "dod-omn21942-local-copies-deleted"
    description: "AC2: the repository copy of the ai-slop checker is gone."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "test ! -e scripts/validation/check_ai_slop.py"
        cwd: "${OMNI_HOME}/omnimemory"
    binds_ac: ["AC2"]
  - id: "dod-omn21942-alignment-test"
    description: "AC3: the CI and pre-commit alignment validator test passes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_validate_ci_precommit_alignment.py -q"
        cwd: "${OMNI_HOME}/omnimemory"
    binds_ac: ["AC3"]
  - id: "dod-omn21942-core-backward-compat-hook"
    description: "AC1: the pre-commit config consumes the core check-no-backward-compat hook in place
      of the deleted repository copy."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q 'id: check-no-backward-compat' .pre-commit-config.yaml"
        cwd: "${OMNI_HOME}/omnimemory"
    binds_ac: ["AC1"]
